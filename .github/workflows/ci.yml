name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-save yaml z-ai-web-dev-sdk@0.0.18 || true
      - name: 23-check arena harness (offline)
        run: node arena/smoke.mjs
      - name: full offline championship
        run: node arena/play.mjs
